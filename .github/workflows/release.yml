name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the installable module and attaches it to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and URLs in module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/lorelinks.zip" \
             '.version = $v | .manifest = $manifest | .download = $download' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build zip
        run: zip -r lorelinks.zip module.json scripts styles lang LICENSE README.md CHANGELOG.md

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" module.json lorelinks.zip --clobber
